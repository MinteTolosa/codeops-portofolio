<!-- Mark up a five-row Ethiopian Airlines flight table with a caption, column scope headers (Flight,
From, To, Departs, Price ETB) and proper thead/tbody -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2-Ethiopian Airlines</title>
</head>
<body>
    <table>
        <caption>Ethiopian Airlines Flight Schedule</caption>
        <thead>
            <tr>
                <th scope="col">Flight</th>
                <th scope="col">From</th>
                <th scope="col">To</th>
                <th scope="col">Departs</th>
                <th scope="col">Price ETB</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>ET 101</td>
                <td>Addis Ababa</td>
                <td>London</td>
                <td>08:00 AM</td>
                <td>15,000</td>
            </tr>
            <tr>
                <td>ET 102</td>
                <td>London</td>
                <td>Addis Ababa</td>
                <td>06:00 PM</td>
                <td>12,000</td>
            </tr>
            <tr>
                <td>ET 103</td>
                <td>Addis Ababa</td>
                <td>New York</td>
                <td>10:00 AM</td>
                <td>20,000</td>
            </tr>
            <tr>
                <td>ET 104</td>
                <td>New York</td>
                <td>Addis Ababa</td>
                <td>08:00 PM</td>
                <td>18,000</td>
            </tr>
            <tr>
                <td>ET 105</td>
                <td>Addis Ababa</td>
                <td>Dubai</td>
                <td>12:00 PM </td>
                <td>8,000 </td >
            </tr>
        </tbody>
    </table>
</body>
</html>
