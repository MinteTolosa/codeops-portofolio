<!-- Add a media block: one dish or landmark image with meaningful alt text inside a figure with a
figcaption, plus a map iframe with a title. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <figure>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Lalibela_Churches.jpg/800px-Lalibela_Churches.jpg" 
        alt="Lalibela Rock-Hewn Churches in Ethiopia" 
        width="600"
        loading="lazy">
        <figcaption>Lalibela Rock-Hewn Churches, a UNESCO World Heritage Site in Ethiopia.</figcaption>
    </figure>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3978.1234567890123!2d39.0325!3d12.0312!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTLCsDAxJzAwLjAiTiAzOcKwMDInMDAuMCJF!5e0!3m2!1sen!2set!4v1610000000000"
             width="600" height="450" 
             style="border:0;" allowfullscreen="" 
             loading="lazy" 
             title="Map of Lalibela, Ethiopia">
    </iframe>
</body>
</html>
