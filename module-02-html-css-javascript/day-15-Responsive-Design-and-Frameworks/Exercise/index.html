<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="stylee.css" />
    <title>Menu Section</title>
  </head>
  <body>
    <section id="menu" class="menu">
      <h2 class="menu-heading">Menu</h2>
      <div class="menu-grid">
        <article class="card">
          <div class="card-header">
            <img
              src="./assets/sambusa.jpg"
              alt="A crispy pastry called sambusa"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name">Sambusa</h3>
            <p class="price text-center">60 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/enkulal-firfir.jpg"
              alt="Scrambled eggs"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Enkulal Firfir</h3>
            <p class="price text-center">80 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/timatim-fitfit.jpg"
              alt="Diced tomatoes with injera soaked in oil and lemon juice sauce"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Timatim Fitfit</h3>
            <p class="price text-center">75 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/doro-wot.jpg"
              alt="Spicy chicken stew"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Doro Wot</h3>
            <p class="price text-center">350 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/siga-tibs.jpg"
              alt="Cooked tender beef cubes"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Siga Tibs</h3>
            <p class="price text-center">320 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/kitfo.jpg"
              alt="Raw finely minced beef drowsed in butter"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Kitfo</h3>
            <p class="price text-center">380 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/siga-wot.jpg"
              alt="Meat stew"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Siga wot</h3>
            <p class="price text-center">300 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/derek-tibs.jpg"
              alt="Crispy dry-fried meat with awaze and chili sauce"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Derek Tibs</h3>
            <p class="price text-center">350 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/shiro-wot.jpg"
              alt="chickpea flour stew"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Shiro Wot</h3>
            <p class="price text-center">180 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/misir-wot.jpg"
              alt="Lentil Stew"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Misir Wot</h3>
            <p class="price text-center">190 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/alicha-kik.jpg"
              alt="Mild split pea stew"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name text-center">Alicha Kik</h3>
            <p class="price text-center">175 ETB</p>
          </div>
        </article>

        <article class="card">
          <div class="card-header">
            <img
              src="./assets/beyaynet-card.jpg"
              alt="Ethiopian platter consisting of injera"
              class="card-image"
            />
          </div>
          <div class="card-body">
            <h3 class="food-name">Beyaynetu</h3>
            <p class="price">250 ETB</p>
          </div>
        </article>
      </div>
    </section>
  </body>
</html>
