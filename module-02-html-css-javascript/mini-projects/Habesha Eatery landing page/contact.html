<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Contact — Habesha Eatery, Bole</title>
        <meta name="description" content="Get in touch with Habesha Eatery in Bole, Addis Ababa.">
        <link rel="stylesheet" href="stylee.css">
    </head>
    <body>
        <header>
            <h1>Contact Habesha Eatery</h1>
            <nav>
                <a href="index.html">Reservations</a> · 
                <a href="contact.html">Contact</a>
            </nav>
        </header>
        <main>
            <form action="/contact" method="post">
                <p>
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>
                </p>
                <!-- TODO: email + message, both labelled and validated -->
                 <p>
                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" placeholder="example@gmail.com">
                 </p>
                 <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                 </p>
                  <p class="button">
                <button type="submit">Submit your message</button>
            </p>
            </form>
           
        </main>
        <footer>Bole, Addis Ababa</footer>
    </body>
</html>
